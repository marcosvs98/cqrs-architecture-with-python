services:
  app:
    build:
      context: .
    working_dir: /home/userapp/app
    volumes:
      - .:/home/userapp/app:rw
    env_file:
      - .env_example
    environment:
      ENVIRONMENT: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ORDER_REPOSITORY_CONNECTION: mongodb://root:admin@mongodb:27017/
      ORDER_REPOSITORY_DATABASE_NAME: order_aggregates
      ORDER_EVENT_STORE_CONNECTION: mongodb://root:admin@mongodb:27017/
      ORDER_EVENT_STORE_DATABASE_NAME: order_events
      ORDER_READ_CONNECTION: mongodb://root:admin@mongodb:27017/
      ORDER_READ_DATABASE_NAME: order_projections
      EVENT_PUBLISHER_ENABLED: "true"
      EVENT_PUBLISHER_KAFKA_BOOTSTRAP: kafka:9092
      EVENT_PUBLISHER_KAFKA_TOPIC: ordering.events
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    user: "1000:1000"
  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "localhost/test", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    expose:
      - "2181"
    restart: unless-stopped
    networks:
      - backend
  kafka:
    image: confluentinc/cp-kafka:latest
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    restart: unless-stopped
    networks:
      - backend
  admin-mongo:
    image: mongo-express:1.0.2
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_SITE_BASEURL: /
      ME_CONFIG_MONGODB_URL: >
        mongodb://root:admin@mongodb:27017
    ports:
      - "1234:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:

volumes:
  mongodb_data:
